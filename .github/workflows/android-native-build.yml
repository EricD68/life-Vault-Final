name: Android security core

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Regenerate dependency lock and install pinned JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --include=dev --no-audit --no-fund
          npm ci --include=dev --no-audit --no-fund

      - name: Upload regenerated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: life-vault-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript and source checks
        run: |
          npx expo install --check
          npm run typecheck
          python3 scripts/dependency_static_check.py
          python3 scripts/security_static_check.py
          python3 scripts/structure_static_check.py
          python3 scripts/import_graph_check.py

      - name: Configure isolated test application id and build version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'app.json'
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)
          data['expo']['name'] = 'Life Vault Test'
          data['expo']['android']['package'] = 'com.lifevault.mobile.test'
          data['expo']['android']['versionCode'] = 1000 + int(os.environ['RUN_NUMBER'])
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(data, handle, indent=2)
              handle.write('\n')
          PY

      - name: Generate Android project and Gradle wrapper
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure arm64-only test build
        run: |
          cat >> android/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          reactNativeArchitectures=arm64-v8a
          EOF2
          chmod +x android/gradlew

      - name: Unit tests, release lint and standalone build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Sign standalone test APK with stable test certificate
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          mkdir -p build-artifacts
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks .github/test-signing/life-vault-test.jks \
            --ks-key-alias lifevault-test \
            --ks-pass pass:lifevault-test-only \
            --key-pass pass:lifevault-test-only \
            --out build-artifacts/life-vault-android-test.apk \
            "$UNSIGNED_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build-artifacts/life-vault-android-test.apk

      - name: Verify release security manifest
        run: |
          set -euo pipefail
          MANIFEST="$(find android/app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml | head -n 1)"
          test -n "$MANIFEST"
          test -f "$MANIFEST"
          grep -q 'package="com.lifevault.mobile.test"' "$MANIFEST" || grep -q 'com.lifevault.mobile.test' "$MANIFEST"
          ! grep -q 'android.permission.INTERNET' "$MANIFEST"
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"

      - name: Upload standalone APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: life-vault-android-test-build
          path: |
            build-artifacts/life-vault-android-test.apk
            android/app/build/reports/tests/**
            package-lock.json
            android/app/build/reports/lint-results-release.*
            modules/life-vault-native/android/build/reports/tests/**
          if-no-files-found: error
          retention-days: 30
